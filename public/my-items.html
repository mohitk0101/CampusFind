<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Items – CampusFind</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .my-items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .my-item-row {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .my-item-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--primary);
      transform: translateX(4px);
    }
    .my-item-avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-elevated);
    }
    .my-item-info {
      flex: 1;
      min-width: 0;
    }
    .my-item-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .my-item-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .my-item-badge {
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .my-item-chevron {
      color: var(--text-muted);
      font-size: 14px;
      margin-left: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">🔍</div>
    <div class="brand-text"><div class="brand-name">CampusFind</div><div class="brand-sub">NIT Kurukshetra</div></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Navigation</div>
    <div class="nav-item" data-href="/index.html"><span class="nav-icon">🏠</span> Dashboard</div>
    <div class="nav-item" data-href="/create-post.html"><span class="nav-icon">➕</span> Report Item</div>
    <div class="nav-item" data-href="/chat.html"><span class="nav-icon">💬</span> Messages <span class="nav-badge nav-msg-badge hidden">0</span></div>
    <div class="nav-section-label">My Account</div>
    <div class="nav-item" data-href="/profile.html"><span class="nav-icon">👤</span> Profile</div>
    <div class="nav-item active" data-href="/my-items.html"><span class="nav-icon">📦</span> My Items</div>
    <div class="nav-item" id="nav-admin" style="display:none" data-href="/admin.html"><span class="nav-icon">⚡</span> Admin Panel</div>
    <div class="nav-item" data-action="logout"><span class="nav-icon">🚪</span> Logout</div>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user" id="sidebar-user">
      <div class="sidebar-avatar"></div>
      <div class="sidebar-user-info"><div class="user-name" id="user-name">User</div><div class="user-role" id="user-role">Student</div></div>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="topbar">
    <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
    <div class="topbar-title">My Items</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notif-btn">🔔<span class="badge hidden" id="notif-badge">0</span></button>
    </div>
  </div>

  <div class="page-body">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchMyItemsTab('lost', this)">Lost Items</button>
      <button class="tab-btn" onclick="switchMyItemsTab('found', this)">Found Items</button>
      <button class="tab-btn" onclick="switchMyItemsTab('resolved', this)">Resolved</button>
      <button class="tab-btn" onclick="switchMyItemsTab('archived', this)">Archived</button>
    </div>

    <!-- Lost Items Tab -->
    <div id="tab-lost" class="tab-pane active">
      <div class="my-items-list" id="list-lost"><div class="spinner"></div></div>
    </div>

    <!-- Found Items Tab -->
    <div id="tab-found" class="tab-pane">
      <div class="my-items-list" id="list-found"><div class="spinner"></div></div>
    </div>

    <!-- Resolved Tab -->
    <div id="tab-resolved" class="tab-pane">
      <div class="my-items-list" id="list-resolved"><div class="spinner"></div></div>
    </div>

    <!-- Archived Tab -->
    <div id="tab-archived" class="tab-pane">
      <div class="my-items-list" id="list-archived"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="notif-panel" id="notif-panel">
  <div class="notif-header"><span class="font-bold">Notifications</span><div class="flex gap-2"><button class="btn btn-ghost btn-sm" id="notif-read-all">Mark all read</button><button class="icon-btn" id="notif-close">✕</button></div></div>
  <div class="notif-list" id="notif-list"></div>
</div>
<div class="toast-container" id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  if (!requireAuth()) {}

  let allMyPosts = [];

  function switchMyItemsTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderGrids();
  }

  async function loadMyItems() {
    try {
      const data = await CF.apiGet('/posts/my');
      allMyPosts = data.posts || [];
      renderGrids();
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  function renderPostRow(post) {
    const img = post.images && post.images.length > 0 ? post.images[post.coverImageIndex || 0] : null;
    const dateText = post.type === 'lost' 
      ? `Lost on ${CF.formatDate(post.date)}` 
      : `Found on ${CF.formatDate(post.date)}`;
    
    let badgeText = post.status.toUpperCase();
    let badgeColor = '';
    if (post.status === 'resolved') {
      badgeText = post.type === 'lost' ? 'Recovered' : 'Returned';
      badgeColor = 'background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3)';
    } else if (post.status === 'pending') {
      badgeText = 'Pending';
      badgeColor = 'background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.3)';
    } else if (post.status === 'rejected') {
      badgeText = 'Rejected';
      badgeColor = 'background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)';
    } else if (post.status === 'active') {
      badgeText = 'Active';
      badgeColor = 'background:rgba(99,102,241,0.15);color:#a5b4fc;border:1px solid rgba(99,102,241,0.3)';
    } else if (post.status === 'archived') {
      badgeText = 'Archived';
      badgeColor = 'background:rgba(255,255,255,0.08);color:var(--text-secondary);border:1px solid var(--border)';
    }

    return `
      <div class="my-item-row" onclick="window.location.href='/post-detail.html?id=${post._id}'">
        <div class="my-item-avatar">
          ${img ? `<img src="${img}" alt="${post.itemName}" style="width:100%;height:100%;object-fit:cover">` : `${CF.CATEGORY_ICONS[post.category] || '📦'}`}
        </div>
        <div class="my-item-info">
          <div class="my-item-title">${post.itemName}</div>
          <div class="my-item-subtitle">${dateText} · 📍 ${post.location}</div>
        </div>
        <div class="my-item-badge" style="${badgeColor}">${badgeText}</div>
        <div class="my-item-chevron">❯</div>
      </div>
    `;
  }

  function renderGrids() {
    const lostList = document.getElementById('list-lost');
    const foundList = document.getElementById('list-found');
    const resolvedList = document.getElementById('list-resolved');
    const archivedList = document.getElementById('list-archived');

    // Filter posts (active & pending stay in type tabs, resolved/archived move)
    const lostPosts = allMyPosts.filter(p => p.type === 'lost' && !['resolved', 'archived'].includes(p.status));
    const foundPosts = allMyPosts.filter(p => p.type === 'found' && !['resolved', 'archived'].includes(p.status));
    const resolvedPosts = allMyPosts.filter(p => p.status === 'resolved');
    const archivedPosts = allMyPosts.filter(p => p.status === 'archived');

    // Render lost
    lostList.innerHTML = lostPosts.length === 0 
      ? `<div class="empty-state"><div class="empty-icon">🔴</div><div class="empty-title">No lost items</div><div class="empty-text">You haven't reported any lost items.</div></div>`
      : lostPosts.map(p => renderPostRow(p)).join('');

    // Render found
    foundList.innerHTML = foundPosts.length === 0
      ? `<div class="empty-state"><div class="empty-icon">🟢</div><div class="empty-title">No found items</div><div class="empty-text">You haven't reported any found items.</div></div>`
      : foundPosts.map(p => renderPostRow(p)).join('');

    // Render resolved
    resolvedList.innerHTML = resolvedPosts.length === 0
      ? `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">No resolved items</div><div class="empty-text">You haven't resolved any exchanges yet.</div></div>`
      : resolvedPosts.map(p => renderPostRow(p)).join('');

    // Render archived
    archivedList.innerHTML = archivedPosts.length === 0
      ? `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">No archived items</div><div class="empty-text">You don't have any archived items.</div></div>`
      : archivedPosts.map(p => renderPostRow(p)).join('');
  }

  // Init admin nav check
  const user = CF.getUser();
  if (user && user.role === 'admin') {
    document.getElementById('nav-admin').style.display = '';
  }

  loadMyItems();
</script>
</body>
</html>
